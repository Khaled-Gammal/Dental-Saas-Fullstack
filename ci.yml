name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dental
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # add `cache: pnpm` here once pnpm-lock.yaml is committed

      - name: Environment
        run: |
          cp .env.example .env
          sed -i 's/localhost:5433/localhost:5432/g' .env

      - name: Database roles (same script Docker runs locally)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d dental -v ON_ERROR_STOP=1 -f docker/postgres/init/01-roles-and-databases.sql

      # switch to --frozen-lockfile once pnpm-lock.yaml is committed after your first local install
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm typecheck
      # db tests rebuild dental_test and run 67 SQL checks (isolation, booking, billing, concurrency);
      # API e2e tests run after them against the same database
      - run: pnpm test
