# Local development stack. Start with:  docker compose up -d
name: dental-saas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dental
    ports:
      - "5433:5432"          # 5433 on your machine, so a locally installed PostgreSQL on 5432 doesn't clash
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dental"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # File storage is not used until the uploads sprint, so it only starts on request:
  #   docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"          # S3 API
      - "9001:9001"          # web console  http://localhost:9001
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"          # SMTP
      - "8025:8025"          # inbox UI    http://localhost:8025

volumes:
  pgdata:
  miniodata:
